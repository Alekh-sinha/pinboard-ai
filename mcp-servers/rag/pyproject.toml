[project]
name = "rag-server"
version = "0.1.0"
description = "Local RAG (PDF/Excel ingest + retrieval) MCP server for coworker personas"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "liteparse>=2.14.0",
    "fastembed>=0.8.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
lancedb = ["lancedb>=0.38.0"]

[project.scripts]
rag-server = "rag_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag_server*"]
