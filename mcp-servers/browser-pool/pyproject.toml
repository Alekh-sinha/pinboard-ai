[project]
name = "browser-pool"
version = "0.1.0"
description = "Headless Playwright render pool as an MCP tool for coworker personas"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "playwright>=1.40",
]

[project.scripts]
browser-pool = "browser_pool:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["browser_pool"]
