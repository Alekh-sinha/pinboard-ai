[project]
name = "search-pro"
version = "0.1.0"
description = "Tavily + Brave web search as distinct MCP tools for coworker personas"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
search-pro = "search_pro:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["search_pro"]
